[package]
name = "getter-core"
version.workspace = true
edition.workspace = true

[features]
default = ["lua"]
lua = ["dep:mlua"]

[dependencies]
json_comments = "0.2"
mlua = { version = "0.10", features = ["luajit", "vendored"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
