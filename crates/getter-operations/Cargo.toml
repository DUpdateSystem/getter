[package]
name = "getter-operations"
version.workspace = true
edition.workspace = true

[features]
default = []
lua = ["getter-core/lua"]

[dependencies]
getter-core = { path = "../getter-core", default-features = false }
getter-storage = { path = "../getter-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
