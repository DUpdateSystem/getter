[package]
name = "getter"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = [
    "crates/getter-core",
    "crates/getter-storage",
    "crates/getter-providers",
    "crates/getter-downloader",
    "crates/getter-plugin-api",
    "crates/getter-rpc",
    "crates/getter-cli",
    "crates/getter-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[features]
default = ["cli", "domain"]
domain = ["dep:getter-core", "dep:getter-storage"]
cli = ["dep:getter-cli"]
rustls-platform-verifier = ["dep:rustls-platform-verifier"]
rustls-platform-verifier-android = ["rustls-platform-verifier", "rustls-platform-verifier/jni"]
webpki-roots = []
native-tokio = []

[dependencies]
getter-core = { path = "crates/getter-core", optional = true }
getter-storage = { path = "crates/getter-storage", optional = true }
getter-cli = { path = "crates/getter-cli", optional = true }
thiserror = "1"
tokio = { version = "1", features = ["net"] }
rustls-platform-verifier = { version = "0.6", optional = true }
